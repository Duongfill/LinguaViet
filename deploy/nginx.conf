# /etc/nginx/sites-available/langapp  — đổi hoc.example.com thành tên miền của bạn
server {
    listen 80;
    server_name hoc.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker phải luôn lấy bản mới
    location = /sw.js {
        proxy_pass http://127.0.0.1:3101;
        add_header Cache-Control "no-cache";
    }
}
# Sau đó chạy: sudo certbot --nginx -d hoc.example.com   (certbot tự thêm cấu hình HTTPS)
